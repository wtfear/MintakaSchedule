<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="mintakaCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="orionGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="whiteText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="beltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0A0F1D" rx="16" />

  <!-- Orion's Belt Celestial Grid -->
  <g opacity="0.14" stroke="#22D3EE" stroke-width="1.2">
    <line x1="40" y1="20" x2="760" y2="20" />
    <line x1="40" y1="110" x2="760" y2="110" />
    <line x1="40" y1="200" x2="760" y2="200" />
    <circle cx="110" cy="110" r="85" stroke-dasharray="3 5" fill="none" />
  </g>

  <!-- Mintaka Star Icon (Western Star of Orion's Belt + Calendar Ring) -->
  <g transform="translate(110, 110)">
    <circle cx="0" cy="0" r="54" fill="url(#mintakaCore)" opacity="0.3" filter="url(#beltGlow)" />
    
    <!-- Outer Chrono Ring -->
    <circle cx="0" cy="0" r="48" stroke="url(#mintakaCore)" stroke-width="2.5" fill="none" stroke-dasharray="8 6" />
    
    <!-- 8-Point Belt Star -->
    <polygon points="0,-64 16,-16 64,0 16,16 0,64 -16,16 -64,0 -16,-16" fill="url(#mintakaCore)" />
    <!-- Inner Gold Compass -->
    <polygon points="0,-40 10,-10 40,0 10,10 0,40 -10,10 -40,0 -10,-10" fill="url(#orionGold)" opacity="0.9" />
    
    <!-- Core -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="7" fill="#0284C7" />
  </g>

  <!-- Typography -->
  <text x="220" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="50" font-weight="900" letter-spacing="2" fill="url(#whiteText)">
    MINTAKA<tspan fill="#22D3EE">SCHEDULE</tspan>
  </text>
  
  <text x="222" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#F59E0B">
    AUTONOMOUS BOOKING &amp; SCHEDULING ENGINE
  </text>

  <text x="222" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" letter-spacing="1.5" fill="#94A3B8">
    CALENDAR APPOINTMENTS • TIMEZONE SYNC • WHATSAPP INTEGRATION • PRISMA
  </text>

  <!-- MIT Badge -->
  <g transform="translate(680, 42)">
    <rect x="-40" y="-14" width="80" height="26" rx="13" fill="#1E293B" stroke="#22D3EE" stroke-width="1.5" />
    <circle cx="-24" cy="-1" r="4" fill="#10B981" />
    <text x="-12" y="3" font-family="sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" letter-spacing="1">MIT</text>
  </g>
</svg>
